name: Saldo ElevenLabs

# Consulta los créditos restantes de ElevenLabs y los guarda en estado/elevenlabs-saldo.json
on:
  push:
    paths:
      - ".github/workflows/saldo-elevenlabs.yml"
      - "estado/pedir-saldo-elevenlabs"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  saldo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          mkdir -p estado
          curl -sS -f https://api.elevenlabs.io/v1/user/subscription -H "xi-api-key: $ELEVENLABS_API_KEY" \
            | jq '{tier, character_count, character_limit, restantes: (.character_limit - .character_count), next_character_count_reset_unix, status}' > estado/elevenlabs-saldo.json
          cat estado/elevenlabs-saldo.json
      - name: Guardar
        run: |
          git config user.name "noblepata-bot"
          git config user.email "noblepataredes@gmail.com"
          git add estado/elevenlabs-saldo.json
          git diff --cached --quiet || (git commit -m "Saldo ElevenLabs" && git push)
