name: Traer audio (ElevenLabs)

# Cuando se sube descargas/<nombre>.url con el enlace de un audio generado en ElevenLabs,
# lo descarga a audio/<nombre>.mp3 y borra el .url.
on:
  push:
    paths:
      - "descargas/**.url"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  traer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar audios
        run: |
          set -e
          mkdir -p audio
          for f in descargas/*.url; do
            [ -e "$f" ] || continue
            nombre=$(basename "$f" .url)
            url=$(head -n1 "$f" | tr -d '\r\n ')
            case "$url" in
              https://elevenlabsusercontent.com/*|https://*.elevenlabs.io/*|https://dnznrvs05pmza.cloudfront.net/*) ;;
              *) echo "URL no permitida en $f"; exit 1 ;;
            esac
            ext=$(echo "$url" | sed -E "s/\?.*//; s/.*\.//"); [ "$ext" = "mp3" ] && dest="audio/$nombre.mp3" || { mkdir -p media/brutos; dest="media/brutos/$nombre.$ext"; }; curl -sS -f -L "$url" -o "$dest"
            git rm -q "$f"
            echo "Descargado audio/$nombre.mp3"
          done
      - name: Guardar
        run: |
          git config user.name "noblepata-bot"
          git config user.email "noblepataredes@gmail.com"
          git add -A audio descargas media
          git diff --cached --quiet || (git commit -m "Audio traído de ElevenLabs" && git push)
